<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruvia</title>
  <link rel="icon" href="icons/favicon.ico?v=20260916b" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/favicon.svg?v=20260916b" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20260916b">
  <link rel="icon" href="icons/icon-192.png?v=20260916b" sizes="192x192" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="title-wrap">
        <h1 class="title">Ruvia</h1>
        <div class="subtitle">compact knot workbench</div>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <section class="canvas-pane" aria-label="canvas pane">
        <section id="canvas" class="canvas" aria-label="knot canvas"></section>
        <svg id="edgeLayer" class="edge-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="knotLayer" class="knot-layer"></div>
        <div class="floating-ui" aria-hidden="false">
          <div id="colorControls" class="color-controls">
            <button id="colorDotBtn" class="color-dot-btn" type="button" title="knot color">●</button>
            <div id="colorPalette" class="color-palette"></div>
          </div>
          <div id="zoomControls" class="zoom-controls" role="group" aria-label="畫布縮放（knot 檢視）">
            <button id="zoomOutBtn" class="zoom-btn" type="button" title="縮小" aria-label="縮小">−</button>
            <button id="zoomInBtn" class="zoom-btn" type="button" title="放大" aria-label="放大">+</button>
          </div>
        </div>
      </section>

      <aside id="tray" class="tray-pane" aria-label="tray area">
        <div class="bulb-row" role="toolbar" aria-label="root actions">
          <button id="newKnotBtn" class="bulb" type="button">+knot</button>
          <button id="exportBtn" class="bulb" type="button">export</button>
          <button id="importBtn" class="bulb" type="button">import</button>
          <button id="agentSpecBtn" class="bulb" type="button" title="Copy the .root spec for an AI agent" aria-label="Copy agent spec">🤖</button>
          <button id="resetBtn" class="bulb" type="button">reset</button>
          <input id="importInput" type="file" accept=".root,.json,application/json" multiple hidden>
        </div>
        <div id="templateTray" class="template-tray"></div>
        <div id="trayKnotLayer" class="tray-knot-layer"></div>
      </aside>
      <button id="undoBtn" class="undo-btn" type="button" title="Undo (Cmd/Ctrl+Z)" aria-label="Undo">↺</button>
      <button id="redoBtn" class="undo-btn redo-btn" type="button" title="Redo (Cmd/Ctrl+Shift+Z)" aria-label="Redo">↻</button>
      <button id="trayCollapseBtn" class="tray-collapse-btn" type="button" aria-label="toggle tray">❯</button>
      <button id="trayDrawerToggle" class="tray-drawer-toggle" type="button" aria-label="open tray" title="tray">🗃️</button>

      <div id="menu-panel" class="menu-panel" aria-label="menu panel">
        <div id="menu-panel-list"></div>
      </div>
      <button id="menuDrawerToggle" class="menu-drawer-toggle" type="button" aria-label="open menu" title="pack">🪉</button>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
